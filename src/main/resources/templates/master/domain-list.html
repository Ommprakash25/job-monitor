<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" class="h-full">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body class="min-h-full bg-slate-50 text-slate-900 antialiased">
<header th:replace="~{fragments/layout :: topnav('master')}"></header>
<main class="mx-auto max-w-7xl px-4 py-8 sm:px-6">
    <div class="flex flex-col gap-8 lg:flex-row">
        <aside th:replace="~{fragments/layout :: masternav(${listKey})}"></aside>
        <section class="min-w-0 flex-1">
            <div th:replace="~{fragments/layout :: flash}"></div>
            <h1 class="text-2xl font-semibold" th:text="${title}">List</h1>
            <p class="mt-1 max-w-2xl text-sm text-slate-600" th:text="${description}">Description</p>

            <form th:action="@{${action}}" method="post" class="card mt-6 flex max-w-2xl items-end gap-4">
                <div class="min-w-0 flex-1">
                    <label class="label" for="value">Add</label>
                    <input class="input" id="value" name="value" th:value="${typedValue}" th:placeholder="${example}">
                </div>
                <button type="submit" class="btn btn-primary">Add</button>
            </form>

            <div class="card mt-6 max-w-2xl">
                <p th:if="${items.isEmpty()}" class="text-sm text-slate-500">The list is empty.</p>
                <ul class="flex flex-wrap gap-2">
                    <li th:each="item : ${items}" class="flex items-center gap-1 rounded-full border border-slate-200 bg-slate-50 py-1 pl-3 pr-1 text-sm">
                        <span th:text="${item}">gmail.com</span>
                        <form th:action="@{${action} + '/delete'}" method="post">
                            <input type="hidden" name="value" th:value="${item}">
                            <button class="grid size-6 place-items-center rounded-full text-slate-400 hover:bg-red-100 hover:text-red-700" th:title="'Remove ' + ${item}">×</button>
                        </form>
                    </li>
                </ul>
            </div>
        </section>
    </div>
</main>
</body>
</html>
