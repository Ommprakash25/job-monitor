spring.application.name=job-monitor

# Only this computer can open the app.
server.address=127.0.0.1
server.port=8080
# Keep session ids out of page addresses.
server.servlet.session.tracking-modes=cookie

# PostgreSQL. The database and its login are created once with db/create-database.sql.
spring.datasource.url=jdbc:postgresql://localhost:5432/job_monitor
spring.datasource.username=job_monitor_app
spring.datasource.password=${JOB_MONITOR_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Page templates are re-read on every request, so edits show without a restart.
spring.thymeleaf.cache=false

# Resume uploads: up to 10 MB per file.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.tomcat.max-swallow-size=50MB

# Mail mode. "gmail" sends and reads through Gmail with your app password.
# "fake" uses the built-in fake mail server on 127.0.0.1, so nothing leaves this computer.
jobmonitor.mail.mode=gmail
jobmonitor.mail.fake-smtp-port=3025
jobmonitor.mail.fake-imap-port=3143

# Key that encrypts stored mailbox passwords. It's created on first start. Keep a backup.
jobmonitor.security.key-file=${user.home}/.job-monitor/secret.key

# start.bat turns this on, so the browser opens once the app is ready.
jobmonitor.open-browser=false

# Nightly database backup (pg_dump). Keeps the newest 14 copies.
jobmonitor.backup.dir=${user.home}/.job-monitor/backups
jobmonitor.backup.pg-dump=C:/Program Files/PostgreSQL/18/bin/pg_dump.exe

# Job listings from Adzuna (free at developer.adzuna.com). Leave the keys empty to switch it off.
jobmonitor.jobs.adzuna-app-id=
jobmonitor.jobs.adzuna-app-key=
jobmonitor.jobs.country=in
jobmonitor.jobs.search=java backend developer
jobmonitor.jobs.location=
