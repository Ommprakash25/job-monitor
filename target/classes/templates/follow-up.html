<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" class="h-full">
<head th:replace="~{fragments/layout :: head('Follow-up')}"></head>
<body class="min-h-full bg-slate-50 text-slate-900 antialiased">
<header th:replace="~{fragments/layout :: topnav('inbox')}"></header>
<main class="mx-auto max-w-3xl px-4 py-8 sm:px-6">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <a th:href="@{/inbox}" class="text-sm text-indigo-700 hover:underline">← Inbox</a>
    <h1 class="mt-2 text-2xl font-semibold">Write a follow-up</h1>
    <p class="mt-1 text-sm text-slate-600">
        It's sent as a reply in the same conversation, so the recruiter sees it under your first email.
    </p>

    <div class="card mt-6 text-sm">
        <p><span class="text-slate-500">To:</span> <span th:text="${original.toAddress}">priya@example.com</span></p>
        <p class="mt-1"><span class="text-slate-500">Original:</span> <span th:text="${original.subject}">Application for …</span></p>
        <p class="mt-1"><span class="text-slate-500">Sent:</span> <span th:text="${sentAt}">date</span></p>
    </div>

    <form th:action="@{/follow-ups/{id}(id=${original.id})}" method="post" class="card mt-6 space-y-4">
        <div>
            <label class="label" for="body">Follow-up email</label>
            <textarea class="input font-mono leading-relaxed" id="body" name="body" rows="10" th:text="${body}"></textarea>
            <p class="hint"><code>{name}</code> is filled in for the recruiter. Replace any <code>[brackets]</code> before sending.</p>
        </div>
        <button type="submit" class="btn btn-primary">Queue follow-up</button>
    </form>
</main>
</body>
</html>
