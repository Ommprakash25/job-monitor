<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" class="h-full">
<head th:replace="~{fragments/layout :: head('Recruiter')}"></head>
<body class="min-h-full bg-slate-50 text-slate-900 antialiased">
<header th:replace="~{fragments/layout :: topnav('recruiters')}"></header>
<main class="mx-auto max-w-2xl px-4 py-8 sm:px-6">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <a th:href="@{/recruiters}" class="text-sm text-indigo-700 hover:underline">← Recruiters</a>
    <h1 class="mt-2 text-2xl font-semibold" th:text="${recruiter.email}">priya@example.com</h1>
    <p class="mt-1 text-sm text-slate-600">
        Emails sent to this recruiter: <span th:text="${sentCount}">0</span>.
        Added from: <span th:text="${recruiter.source}">IMPORTED</span>.
    </p>

    <form th:action="@{/recruiters/{id}(id=${recruiter.id})}" method="post" class="card mt-6 space-y-5">
        <div>
            <label class="label" for="name">Name</label>
            <input class="input" id="name" name="name" th:value="${recruiter.name}" placeholder="Leave blank to use Hiring Team">
        </div>
        <div>
            <label class="label" for="companyDomain">Company domain</label>
            <input class="input" id="companyDomain" name="companyDomain" th:value="${companyDomain}" placeholder="infosys.com">
            <p class="hint">
                Currently <span th:text="${recruiter.company.name}">Infosys</span>.
                Leave blank to keep it. Free-mail addresses (gmail.com and similar) always go under "Others".
            </p>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
    </form>
</main>
</body>
</html>
