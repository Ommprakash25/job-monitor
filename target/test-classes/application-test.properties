# Tests use their own database and their own fake mail ports,
# so they never touch your real data or clash with a running app.
spring.datasource.url=jdbc:postgresql://localhost:5432/job_monitor_test
# Tests always use the fake mail server, so they never touch Gmail.
jobmonitor.mail.mode=fake
jobmonitor.mail.fake-smtp-port=13025
jobmonitor.mail.fake-imap-port=13143
jobmonitor.security.key-file=${java.io.tmpdir}/job-monitor-test/secret.key
